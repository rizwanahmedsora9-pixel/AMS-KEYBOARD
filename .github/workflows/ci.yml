name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17 (Android Gradle Plugin 8.2+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        # v3 requested the retired "tools" SDK package by default and failed
        # before the build could start. v4 uses the current command-line tools.
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (auto-correct engine)
        id: unit_tests
        run: |
          mkdir -p build-reports
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee build-reports/unit-tests.log

      - name: Build debug APK (assembleDebug)
        id: assemble
        run: |
          mkdir -p build-reports
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build-reports/assembleDebug.log

      - name: Annotate Gradle build failure
        if: failure() && steps.assemble.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('build-reports/assembleDebug.log')
          text = log.read_text(errors='replace') if log.exists() else 'No Gradle log was captured.'
          lines = text.splitlines()
          start = next((i for i, line in enumerate(lines)
                        if 'FAILURE: Build failed' in line or 'What went wrong:' in line),
                       max(0, len(lines) - 80))
          tail = '\n'.join(lines[start:start + 120])
          message = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Gradle build failed::' + message)
          PY

      - name: Verify debug APK exists and is signed with the shared key
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | tee build-reports/apk-signature.txt
          grep -q "B45B3D9D7A194F3207A9A4C20DC41825CF3D0FD6187A634101D71377FE3A88AD" build-reports/apk-signature.txt

      - name: Upload debug APK artifact
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: ams-keyboard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Run Android lint (tool chain report)
        id: lint
        # Lint findings are reported, but do not discard an already-built APK.
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Upload unit test report
        id: upload-tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ams-keyboard-unit-tests
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn

      - name: Generate build report (tool chain)
        if: always()
        run: |
          mkdir -p build-reports
          cp -r app/build/reports build-reports/ 2>/dev/null || true
          cp -r app/build/outputs build-reports/outputs 2>/dev/null || true
          {
            echo "Build timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Event: $GITHUB_EVENT_NAME"
          } > build-reports/build-info.txt
          java -version > build-reports/java-version.txt 2>&1 || true
          ./gradlew --version > build-reports/gradle-version.txt 2>&1 || true
          sdkmanager --list_installed > build-reports/sdk-packages.txt 2>&1 || true

      - name: Upload lint report artifact
        id: upload-lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ams-keyboard-lint-report
          path: app/build/reports/lint-results-debug.*
          retention-days: 30
          if-no-files-found: warn

      - name: Upload full tool chain report artifact
        id: upload-toolchain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ams-keyboard-toolchain-report
          path: build-reports/
          retention-days: 30
          if-no-files-found: error

      - name: Publish build summary
        if: always()
        env:
          APK_UPLOAD: ${{ steps.upload-apk.outcome }}
          LINT_RUN: ${{ steps.lint.outcome }}
          LINT_UPLOAD: ${{ steps.upload-lint.outcome }}
          TOOLCHAIN_UPLOAD: ${{ steps.upload-toolchain.outcome }}
          UNIT_TESTS: ${{ steps.unit_tests.outcome }}
          TEST_UPLOAD: ${{ steps.upload-tests.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## AMS Keyboard CI Summary

          - **Trigger:** \`$GITHUB_EVENT_NAME\`
          - **Branch:** \`$GITHUB_REF_NAME\`
          - **Commit:** \`$GITHUB_SHA\`
          - **Unit tests:** \`$UNIT_TESTS\`
          - **Debug APK upload:** \`$APK_UPLOAD\`
          - **Lint run:** \`$LINT_RUN\`
          - **Lint report upload:** \`$LINT_UPLOAD\`
          - **Unit test report upload:** \`$TEST_UPLOAD\`
          - **Tool chain report upload:** \`$TOOLCHAIN_UPLOAD\`

          Successfully uploaded artifacts are available in the **Artifacts** section of this workflow run:
          - \`ams-keyboard-debug-apk\` — installable debug APK
          - \`ams-keyboard-unit-tests\` — auto-correct / suggestion test report
          - \`ams-keyboard-lint-report\` — lint results
          - \`ams-keyboard-toolchain-report\` — build outputs and tool chain versions
          EOF
