plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ams.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.ams.keyboard"
        minSdk 24
        targetSdk 34

        // Bump versionCode for every build you hand out. Android only replaces an installed app
        // when the new APK has the same applicationId, the same signing key and a versionCode
        // that is greater than or equal to the installed one.
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Same applicationId as release so a debug build also upgrades in place.
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
    }
}

// AMS Keyboard deliberately has zero runtime dependencies: the IME and the settings screen use
// only framework views, so the build needs no external artifacts and the APK stays small.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
