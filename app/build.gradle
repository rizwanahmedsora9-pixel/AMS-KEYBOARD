plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ams.keyboard'
    compileSdk 34

    // A checked-in debug keystore gives every build the same signature, so installing a new APK
    // over an older one always works (Gradle's default debug key is generated per machine/runner,
    // which is the reason updates were rejected with "App not installed").
    // This key is public knowledge by design: it only signs debug builds, never a release.
    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.ams.keyboard"
        minSdk 24
        targetSdk 34

        // Bump versionCode for every build you hand out. Android only replaces an installed app
        // when the new APK has the same applicationId, the same signing key and a versionCode
        // that is greater than or equal to the installed one.
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debugConfig
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
    }
}

// AMS Keyboard deliberately has zero runtime dependencies: the IME and the settings screen use
// only framework views, so the build needs no external artifacts and the APK stays small.
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
